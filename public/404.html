<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Learn Academy</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page Application redirect script
      // Redirects 404 back to root index preserving path in hash or query
      var segmentCount = 0;
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
